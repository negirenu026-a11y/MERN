<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
                padding: 0;
                box-sizing: border-box;
        }
        body{
            height:100vh;
            width: 100vw;
        }
        .container{
            height: 100%;
            width: 100%;
            background-color: rgb(90, 90, 89);
            display: grid;
            grid-template-rows:repeat(3,1fr) ;
            grid-template-columns: repeat(3,1fr);

        }
        .item{
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
        }
        .header{
            background-color: rgb(65, 114, 86);
            grid-column-start: 1;
            grid-column-end: 4;
          
            
        }
        .sidebar{
            background-color: rgb(246, 234, 247);
            grid-row-start: 2;
            grid-row-end: 4;
        }
        .section1{
            background-color: rgb(184, 107, 128);
            grid-column-start: 2;
            grid-column-end: 4;
           
        }
        .section2{
            background-color: rgb(210, 177, 30);
            grid-column-start: 2;
            grid-column-end: 3;

        }
        .section3{
            background-color: rgb(255, 196, 197);
          
        }
        .footer{
            background-color: cornflowerblue;
            grid-column-start: 1;
            grid-column-end: 4;
            height: 100px;
          
        }
    </style>
</head>
<body>
    

   
    <div class="container">
        <div class="item header">Header</div>
        <div class="item sidebar">Sidebar</div>
        <div class="item section1">Section1</div>
        <div class="item section2">Section2</div>
        <div class="item section3">Section3</div>
        <div class="item footer">Footer</div>
    </div>
</body>
</html>
