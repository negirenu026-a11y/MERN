<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        body{
            background-color: blue;
            height: 200px;
            width: 200px;
           
        }
        .container{
            height: 200px;
            width: 200px;
            background-color: blueviolet;
            animation-direction: alternate;
            position: relative;
            animation-name:move  ;
           animation-duration:15s ;
           animation-delay:2s;
           animation-iteration-count: 2;
           animation-timing-function:ease-in;

    
        }
        @keyframes move{
            0%{
                top:0;
                left:0;
            }
            10%{
                top:500px;
                left:100px;
            }
            20%{
                top:500px;
                left:100px;
            }
             30%{
                top:500px;
                left:100px;
            }
             40%{
                top:0px;
                left:400px;
            }
            50%{
                top:500px;
                left:500px;
            }
            60%{
                top:500px;
                left:100px;
            }
            70%{
                top:500px;
                left:100px;
            }
             80%{
                top:500px;
                left:100px;
            }
             90%{
                top:500px;
                left:100px;
            }
             100%{
                top:0;
                left:0;
            }

           

        }
        

    </style>
</head>
<body>
    <div class="container"></div>
</body>
</html>
