<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0px;
        }
        .container{
            background-color: aqua;
            height: 200px;
            width: 700px;
            display: flex;
        }
        .container1{
            height: 100px;
            width:100px;
            background-color: blueviolet;
            margin-top: 20px;
            margin-left: 40px;

        }
        .container2{
            height: 100px;
            width:100px;
            background-color: rgb(43, 46, 226);
            position:relative;
            top:80px;
            left:80px;

        }
        .container3{
            height: 100px;
            width:100px;
            background-color: rgb(43, 226, 70);
            position:absolute;
            top:40px;
            left:80px;
            z-index: 1;

        }
        .container4{
            height: 100px;
            width:100px;
            background-color: rgb(226, 128, 43);
            position: fixed;
            left:80px;
    

        }
        .container5{
            height: 100px;
            width:100px;
            background-color: rgb(43, 226, 214);
            position: sticky;
            top:90px;

        }
    </style>
</head>
<body>
    <div class="container">
       <div class="container1">container1</div>
       <div class="container2">container2</div>
       <div class="container3">container3</div>
       <div class="container4">container4</div>
       <div class="container5">container5</div>
    </div>
</body>
</html>
