<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Website Layout</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /
        header {
            background-color: #2c3e50;
            color: white;
            padding: 15px;
            text-align: center;
        }

        /* Main layout */
        .container {
            display: flex;
            min-height: 80vh;
        }

        /* Sidebar */
        aside {
            width: 20%;
            background-color: #ecf0f1;
            padding: 15px;
        }

        aside ul {
            list-style: none;
            padding: 0;
        }

        aside ul li {
            padding: 10px;
            background: #bdc3c7;
            margin-bottom: 10px;
            text-align: center;
        }

        /* Content area */
        main {
            width: 80%;
            padding: 15px;
        }

        .section {
            background-color: #f9f9f9;
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
        }

        /* Footer */
        footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>My Website</h1>
        <p>Top Header</p>
    </header>

    <div class="container">
        <aside>
            <h3>Sidebar</h3>
            <ul>
                <li>Menu 1</li>
                <li>Menu 2</li>
                <li>Menu 3</li>
            </ul>
        </aside>

        <main>
            <div class="section">
                <h2>Section 1</h2>
                <p>This is the first section.</p>
            </div>

            <div class="section">
                <h2>Section 2</h2>
                <p>This is the second section.</p>
            </div>

            <div class="section">
                <h2>Section 3</h2>
                <p>This is the third section.</p>
            </div>
        </main>
    </div>

    <footer>
        <p>© 2026 My Website | Footer</p>
    </footer>

</body>
</html>
