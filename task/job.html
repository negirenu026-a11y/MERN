<div class="new1">
    <h1>Job Application Form</h1>
    <p>Please fill out the form below to apply for the Web Developer position.</p>

    <div class="form">
        <form action="/login.html">

            <h3>Personal Details</h3>

            <label>Full Name:</label>
            <input type="text" placeholder="John Doe">

            <label>Email:</label>
            <input type="email">

            <label>Date of Birth:</label>
            <input type="date">

            <h3>Skills & Experience</h3>

            <label>Which languages do you know?</label>
            <div class="checkbox">
                <label><input type="checkbox"> HTML</label>
                <label><input type="checkbox"> CSS</label>
                <label><input type="checkbox"> JavaScript</label>
            </div>

            <label>Years of Experience:</label>
            <select>
                <option>0-1 Years</option>
                <option>1-3 Years</option>
                <option>3-5 Years</option>
            </select>

            <h3>Documents</h3>

            <label>Upload Resume:</label>
            <input type="file">

            <div class="buttons">
                <input type="submit" value="Submit Application" class="submit">
                <input type="reset" value="Clear Form" class="clear">
            </div>

        </form>
    </div>
