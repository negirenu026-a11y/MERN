<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 2D Transformation </title>
    <style>
        *{
            margin: 0;
        }
        body{
            background-color: chartreuse;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .box{
            width:200px;
            height: 200px;
            background-color: palevioletred;
            color: black;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;

        }
        .box:hover{
            transform: 
            translate(30px,-20px)
    
            rotate(15deg)
            scale(1.2)
            skew(8deg,4deg); 


        }
    </style>
</head>
<body>
    <div class="box">hy</div>
</body>
</html>
